name: Sonarcloud
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  sonarcloud:
    runs-on: homelab-arc-runner-set
    defaults:
      run:
        working-directory: ./backend
    env:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: test
      POSTGRES_PASSWORD: YouShallNotPass
      POSTGRES_USER: appuser
    container: python:3.13-slim
    services:
      postgres:
        env:
          DB_HOST: postgres
          DB_PORT: 5432
          POSTGRES_DB: test
          POSTGRES_PASSWORD: YouShallNotPass
          POSTGRES_USER: appuser
        image: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install Python
        uses: actions/setup-python@v4
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
      - name: Install dependencies with uv
        run: uv sync --extra test
      - name: Run Tests
        run: |
          uv run coverage run manage.py test &&
          uv run coverage xml
      - name: Create docker image
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        run: docker create --name sonar-${GITHUB_SHA} -e SONAR_TOKEN=${SONAR_TOKEN} -e SONAR_HOST_URL=${SONAR_HOST_URL} sonarsource/sonar-scanner-cli
      - name: Add files
        run: docker cp ./ sonar-${GITHUB_SHA}:/usr/src/.
      - name: Run sonar
        run: docker start -i sonar-${GITHUB_SHA}
      - name: Docker cleanup
        run: |
          docker stop sonar-${GITHUB_SHA}
          docker rm sonar-${GITHUB_SHA}
          docker system prune -f
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
